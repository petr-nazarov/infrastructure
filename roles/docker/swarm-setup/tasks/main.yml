---
- name: Install Docker SDK via apt
  become: true
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
    update_cache: true
  loop:
    - python3-docker
    - python3-jsondiff

# 1. Initialize Swarm on the Manager
- name: Init Swarm on Manager
  community.docker.docker_swarm:
    state: present
    advertise_addr: "{{ ansible_host }}"
  when: inventory_hostname in groups['docker-swarm-managers']

# 2. Read the worker join token from the manager. Each worker asks the manager
# directly, so this works when the play is limited to a worker (`just run home-media`).
- name: Get Join Token from Manager
  community.docker.docker_swarm_info:
  delegate_to: "{{ groups['docker-swarm-managers'][0] }}"
  register: swarm_manager_info
  when: inventory_hostname in groups['docker-swarm-workers']

# 3. Join the Swarm as a Worker
- name: Join Swarm as Worker
  community.docker.docker_swarm:
    state: join
    join_token: "{{ swarm_manager_info.swarm_facts.JoinTokens.Worker }}"
    remote_addrs: ["{{ hostvars[groups['docker-swarm-managers'][0]]['ansible_host'] }}:2377"]
  when: inventory_hostname in groups['docker-swarm-workers']
