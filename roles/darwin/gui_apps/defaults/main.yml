---
# Homebrew casks. Arch apps that macOS already covers are left out:
# okular / qimgv -> Preview, nemo -> Finder, gparted -> Disk Utility, ark -> Archive Utility
darwin_gui_apps:
  # Personal
  - ghostty
  - zen
  - opera
  - obsidian
  - ferdium # messengers in one window
  - peteonrails/voxtype/voxtype # push-to-talk voice typing
  - hammerspoon # holds cmd+m for voxtype, see ~/.hammerspoon in dotfiles
  # Launcher, replaces Spotlight on cmd+space (see darwin/preferences)
  - raycast
  # qbittorrent: cask disabled by Homebrew on 2026-09-01, it fails the Gatekeeper check
  - localsend
  # Media playing
  - iina # mpv based player, instead of smplayer
  # Professional
  - anydesk
  - studio-3t
  - dbeaver-community
  # Fonts
  - font-fira-code
  - font-symbols-only-nerd-font
  - font-noto-sans

# Multilingual (the .en models only know English); large-v3-turbo runs on Metal.
darwin_voxtype_model: large-v3-turbo
# Constrained auto-detect: whisper picks between these per recording
darwin_voxtype_language: '["en", "ru"]'
# LLM cleanup of each dictation through a local Ollama model (voxtype-postprocess in
# dotfiles). Off: the raw transcript is typed. The transcript lands on the clipboard either way.
darwin_voxtype_llm_enabled: true
# Multilingual; thinking is switched off per request
darwin_voxtype_llm_model: qwen3.5:4b

darwin_ferdium_shortcuts:
  activateNextService: Ctrl+tab
  activatePreviousService: Ctrl+Shift+tab
  activateServiceUsesAlt: true

# Third-party taps the casks above come from
darwin_gui_taps:
  - peteonrails/voxtype

# Formulae that go with the GUI
darwin_gui_packages:
  - mpv
