---
- name: Update apt cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
- name: Install pre req packages
  become: true
  ansible.builtin.apt:
    name: "{{ debian_docker_packages }}"
    state: present
- name: Download Docker GPG key
  become: true
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /usr/share/keyrings/docker-archive-keyring.gpg
    mode: "0644"
- name: Add Docker repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/docker-archive-keyring.gpg] https://download.docker.com/linux/debian {{ ansible_facts['lsb']['codename'] }} stable"
    state: present
- name: Update apt cache after adding Docker repo
  become: true
  ansible.builtin.apt:
    update_cache: true
- name: Install Docker packages
  become: true
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
    state: present
- name: Ensure Docker service is running
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
- name: Add Ansible user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

# Boot resilience: dockerd exits 1 when the swarm cluster component cannot
# reach the network yet ("could not find local IP address ... network is
# unreachable"). The stock unit then gives up after 3 failures in 60s and
# Docker stays dead until started by hand.
- name: Check for the ifupdown wait-online unit
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/ifupdown-wait-online.service
  register: ifupdown_wait_online
- name: Enable ifupdown wait-online so network-online.target really waits
  become: true
  ansible.builtin.systemd:
    name: ifupdown-wait-online.service
    enabled: true
  when: ifupdown_wait_online.stat.exists
- name: Ensure docker.service drop-in directory exists
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
- name: Let dockerd retry indefinitely instead of hitting the start limit
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-boot-resilience.conf
    mode: "0644"
    content: |
      # Managed by Ansible - roles/debian/docker
      [Unit]
      StartLimitIntervalSec=0
      [Service]
      Restart=always
      RestartSec=5
  notify: Reload systemd daemon
