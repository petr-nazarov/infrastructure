---
arch_gui_apps:
  # Personal
  - ghostty
  - zen-browser-bin
  - opera
  - obsidian
  - ferdium-bin # messengers in one window
  - voxtype-bin # push-to-talk voice typing, prebuilt (voxtype builds from source)
  - wtype # voxtype types through it; without it the text only lands on the clipboard
  - okular
  - nemo
  - qbittorrent
  - gparted
  - localsend-bin
  # - nekoray-bin
  - ark # unzip
  # Media playing
  - qimgv
  - mpv
  - smplayer
  - libmpeg2
  # Professional
  - anydesk
  - studio-3t
  - dbeaver-ce-bin
  # Sound
  - notify-send
  - paplay

# Multilingual (the .en models only know English). The macs run small: slower hardware
arch_voxtype_model: large-v3-turbo
# Constrained auto-detect: whisper picks between these per recording
arch_voxtype_language: '["en", "ru"]'
# LLM cleanup of each dictation through a local Ollama model (voxtype-postprocess in
# dotfiles). Off: the raw transcript is typed. The transcript lands on the clipboard either way.
arch_voxtype_llm_enabled: true
# Multilingual; thinking is switched off per request
arch_voxtype_llm_model: qwen3.5:4b
