---
# # Required on any machine, server or
base_packages:
  - git
  - rsync
  - tmux
#### Specific to arch
arch_specific_packages:
  - github-cli
  - bind # for dig
  - poppler # yazi pdf preview
  - ueberzugpp # yazi image preview
  # Fonts
  - ttf-fira-code
  - ttf-nerd-fonts-symbols
  - noto-fonts
#### Specific to debian
debian_specific_packages:
  - gh
  - poppler-utils # yazi pdf preview
#### Specific to macOS (Homebrew formulae)
darwin_specific_packages:
  - gh
  - poppler # yazi pdf preview
  - sevenzip # archive preview (7-zip on arch)
  - libmagic # libmagic-dev on debian
#### common_packages that Homebrew doesn't have or macOS doesn't need
darwin_skip_packages:
  - vi # ships with macOS
  - zsh # ships with macOS, and is the default shell
  - 7-zip # called sevenzip in Homebrew
  - libmagic-dev # called libmagic in Homebrew
  - xclip # X11 only, macOS has pbcopy / pbpaste
common_packages:
  - vi
  - vim
  - fzf
  - curl
  - wget
  - zsh
  - stow
  - rclone
  - syncthing
  - ncdu
  - btop
  - ffmpeg # video thumbnails
  - 7-zip # archive preview
  - resvg # svg preview
  - imagemagick # image preview
  # TUI
  - neovim
  - tmuxinator
  # System
  - asciidoctor
  - libmagic-dev
  - ffmpegthumbnailer
  - xclip
