---
- name: Install gui applications
  become: true
  become_user: aur_builder
  kewlfft.aur.aur:
    name: "{{ arch_gui_apps }}"
    use: yay
- name: Remove replaced gui applications
  become: true
  community.general.pacman:
    name: "{{ arch_gui_apps_removed }}"
    state: absent
# The [x] trick keeps pkill from matching the shell running it
- name: Stop replaced gui applications that are still running
  ansible.builtin.command: pkill -f {{ ('[' ~ item[0] ~ ']' ~ item[1:]) | quote }}
  loop: "{{ arch_gui_apps_removed_processes }}"
  register: arch_gui_removed_kill
  changed_when: arch_gui_removed_kill.rc == 0
  failed_when: arch_gui_removed_kill.rc > 1
- name: Remove what the replaced gui applications left behind
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: absent
  loop: "{{ arch_gui_apps_removed_data }}"

# Voxtype: same languages as on the macs, a bigger model. Its own evdev hotkey is off: it misses
# the release when SUPER comes up before M. voxtype-ptt (dotfiles) reads the keys instead and
# runs `voxtype record start/stop`; Hyprland only swallows SUPER+M (hyprland.lua in dotfiles).
# The daemon reads its config only on start.
- name: Set up voxtype
  ansible.builtin.command: voxtype setup --download --quiet
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.config/voxtype/config.toml"
# The package links the CPU build; on CPU large-v3-turbo takes ~20s per short recording.
# The Vulkan build picks device 0, which is the discrete GPU on the desktop.
- name: Check the active voxtype backend
  ansible.builtin.stat:
    path: /usr/bin/voxtype
  register: arch_voxtype_binary
- name: Switch voxtype to the Vulkan backend
  become: true
  ansible.builtin.command: voxtype setup gpu --enable
  when: arch_voxtype_binary.stat.lnk_target is not search('vulkan')
  changed_when: true
  notify: Restart voxtype
- name: Download the voxtype model
  ansible.builtin.command: voxtype setup --download --model {{ arch_voxtype_model }} --quiet
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.local/share/voxtype/models/ggml-{{ arch_voxtype_model }}.bin"
# Whether voxtype-target has switched voxtype to the voxtype server, so a run keeps that
- name: Read voxtype's config
  ansible.builtin.slurp:
    path: "{{ ansible_facts['user_dir'] }}/.config/voxtype/config.toml"
  register: arch_voxtype_config
- name: Note whether voxtype transcribes on the voxtype server
  ansible.builtin.set_fact:
    arch_voxtype_remote: "{{ arch_voxtype_config.content | b64decode is search('(?m)^mode = \"remote\"') }}"
- name: Configure voxtype
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/voxtype/config.toml"
    regexp: "{{ item.regexp }}"
    insertafter: "{{ item.section }}"
    line: "{{ item.line }}"
  loop:
    - { section: '^\[hotkey\]', regexp: '^enabled = ', line: enabled = false }
    - { section: '^\[whisper\]', regexp: '^model = ', line: 'model = "{{ arch_voxtype_model }}"' }
    # On the voxtype server whisper only auto-detects: voxtype sends the first language of a list.
    # voxtype-target swaps between this list (kept in the comment) and "auto" when it switches.
    - { section: '^\[whisper\]', regexp: '^language = ', line: "language = {{ '\"auto\"' if arch_voxtype_remote else arch_voxtype_language }}" }
    - { section: '^\[whisper\]', regexp: '^# local language \(voxtype-target\): ', line: "# local language (voxtype-target): {{ arch_voxtype_language }}" }
    # Spelling hint for jargon (voxtype_initial_prompt); remote mode sends it with the audio
    - { section: '^\[whisper\]', regexp: '^initial_prompt = ', line: "initial_prompt = {{ voxtype_initial_prompt | to_json }}" }
    # Typing waits until SUPER is up, or the letters fire Hyprland binds. The default 750 ms
    # gives up too early for a slow release and falls back to the clipboard.
    - { section: '^\[output\]', regexp: '^modifier_release_timeout_ms = ', line: modifier_release_timeout_ms = 3000 }
    # Paste instead of typing: wtype puts the Nth distinct character on keycode N+8, and Ghostty
    # reads Cyrillic on keycodes 22/23 as Backspace/Tab. Ctrl+Shift+V is the terminal paste.
    - { section: '^\[output\]', regexp: '^mode = ', line: mode = "paste" }
    - { section: '^\[output\]', regexp: '^paste_keys = ', line: paste_keys = "ctrl+shift+v" }
  loop_control:
    label: "{{ item.line }}"
  notify: Restart voxtype
# The desktop's voxtype server (arch/voxtype_server) as the remote endpoint. Never `mode`:
# under [whisper] that is voxtype-target's (dotfiles) local/remote switch, so a run keeps it.
# voxtype-postprocess sends the LLM cleanup to the same place while it is remote.
- name: Point voxtype at the voxtype server
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/voxtype/config.toml"
    regexp: "{{ item.regexp }}"
    insertafter: '^\[whisper\]'
    line: "{{ item.line }}"
    mode: "0600" # holds the token
  loop:
    - { regexp: '^remote_endpoint = ', line: 'remote_endpoint = "{{ voxtype_server_url }}"' }
    - { regexp: '^remote_api_key = ', line: 'remote_api_key = "{{ voxtype_server_token }}"' }
    # Fail fast when the desktop is asleep; a 5 s dictation takes ~0.3 s there
    - { regexp: '^remote_timeout_secs = ', line: remote_timeout_secs = 10 }
  loop_control:
    label: "{{ item.regexp }}"
  notify: Restart voxtype
- name: Install the voxtype user service
  ansible.builtin.command: voxtype setup systemd
  args:
    creates: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/voxtype.service"

# voxtype-ptt and voxtype's wait for modifier release both read /dev/input. Group changes
# reach the user services only after a fresh login (a reboot is simplest).
- name: Let the user read keyboards for voxtype
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: input
    append: true
- name: Install the voxtype push-to-talk service
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/systemd/user/voxtype-ptt.service"
    mode: "0644"
    content: |
      [Unit]
      Description=Voxtype push-to-talk on SUPER+M (voxtype-ptt in dotfiles)
      PartOf=graphical-session.target
      After=graphical-session.target voxtype.service

      [Service]
      ExecStart=%h/.local/bin/voxtype-ptt
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=graphical-session.target
  register: arch_voxtype_ptt_unit
- name: Start the voxtype push-to-talk service
  ansible.builtin.systemd_service:
    name: voxtype-ptt
    scope: user
    enabled: true
    state: "{{ 'restarted' if arch_voxtype_ptt_unit.changed else 'started' }}"
    daemon_reload: "{{ arch_voxtype_ptt_unit.changed }}"

# Every transcript goes through voxtype-postprocess (dotfiles): it copies the raw text to
# the clipboard and, with --llm, swaps in the local model's cleanup before it is typed.
# Flip arch_voxtype_llm_enabled to turn the LLM off; Ollama stays installed.
- name: Set up Ollama for the voxtype cleanup
  when: arch_voxtype_llm_enabled
  block:
    - name: Install Ollama
      become: true
      community.general.pacman:
        name: ollama-vulkan
        state: present
    - name: Start Ollama
      become: true
      ansible.builtin.systemd_service:
        name: ollama
        enabled: true
        state: started
    - name: Check for the voxtype cleanup model
      ansible.builtin.command: ollama show {{ arch_voxtype_llm_model }}
      register: arch_voxtype_llm_model_check
      changed_when: false
      failed_when: false
    - name: Pull the voxtype cleanup model
      ansible.builtin.command: ollama pull {{ arch_voxtype_llm_model }}
      when: arch_voxtype_llm_model_check.rc != 0
      changed_when: true
- name: Configure voxtype post-processing
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/.config/voxtype/config.toml"
    marker: "# {mark} ANSIBLE MANAGED post-processing (arch/gui_apps)"
    block: |
      [output.post_process]
      command = "{{ ansible_facts['user_dir'] }}/.local/bin/voxtype-postprocess{{ ' --llm ' ~ arch_voxtype_llm_model if arch_voxtype_llm_enabled else '' }}"
      timeout_ms = 10000
  notify: Restart voxtype
