---
- name: Write macOS defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: present
  loop: "{{ darwin_preferences }}"
  loop_control:
    label: "{{ item.domain }} {{ item.key }}={{ item.value }}"
  notify: Restart Dock and Finder

# The next tasks are plain `defaults write`s: osx_defaults can't read a dict back (plutil refuses
# to convert it to JSON) and can't write an array of dicts at all. -dict-add keeps entries added
# by hand in System Settings.

# activateSettings reloads the shortcuts now instead of at the next login
- name: Set the system shortcuts
  ansible.builtin.shell: |
    before=$(defaults read com.apple.symbolichotkeys AppleSymbolicHotKeys 2>/dev/null)
    defaults write com.apple.symbolichotkeys AppleSymbolicHotKeys -dict-add \
    {% for h in darwin_symbolic_hotkeys %}
      {{ h.id }} '<dict><key>enabled</key><{{ h.enabled | default(true) | ternary("true", "false") }}/><key>value</key><dict><key>parameters</key><array>{% for p in h.key %}<integer>{{ p }}</integer>{% endfor %}</array><key>type</key><string>standard</string></dict></dict>' \
    {% endfor %}
    || exit 1
    [ "$before" = "$(defaults read com.apple.symbolichotkeys AppleSymbolicHotKeys)" ] && exit 0
    /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings -u
    echo changed
  register: darwin_symbolic_hotkeys_write
  changed_when: "'changed' in darwin_symbolic_hotkeys_write.stdout"

- name: Set the menu shortcuts
  ansible.builtin.shell: |
    before=$(defaults read -g NSUserKeyEquivalents 2>/dev/null)
    defaults write -g NSUserKeyEquivalents -dict-add \
    {% for s in darwin_menu_shortcuts %}
      {{ s.title | quote }} {{ s.key | quote }} \
    {% endfor %}
    || exit 1
    [ "$before" = "$(defaults read -g NSUserKeyEquivalents)" ] || echo changed
  register: darwin_menu_shortcuts_write
  changed_when: "'changed' in darwin_menu_shortcuts_write.stdout"

- name: Set the date format
  ansible.builtin.shell: |
    before=$(defaults read -g AppleICUDateFormatStrings 2>/dev/null)
    defaults write -g AppleICUDateFormatStrings -dict 1 {{ darwin_date_format | quote }} || exit 1
    [ "$before" = "$(defaults read -g AppleICUDateFormatStrings)" ] || echo changed
  register: darwin_date_format_write
  changed_when: "'changed' in darwin_date_format_write.stdout"

# Applies after logging out
- name: Remap modifier keys
  ansible.builtin.shell: |
    key=com.apple.keyboard.modifiermapping.{{ darwin_keyboard_id }}
    before=$(defaults -currentHost read -g "$key" 2>/dev/null)
    defaults -currentHost write -g "$key" -array \
    {% for m in darwin_modifier_mappings %}
      '<dict><key>HIDKeyboardModifierMappingSrc</key><integer>{{ m.src }}</integer><key>HIDKeyboardModifierMappingDst</key><integer>{{ m.dst }}</integer></dict>' \
    {% endfor %}
    || exit 1
    [ "$before" = "$(defaults -currentHost read -g "$key")" ] || echo changed
  register: darwin_modifier_remap
  changed_when: "'changed' in darwin_modifier_remap.stdout"

- name: Install dockutil
  community.general.homebrew:
    name: dockutil
    state: present
- name: Read the Dock items
  ansible.builtin.command: /opt/homebrew/bin/dockutil --list
  register: darwin_dock_items
  changed_when: false
# Column 2 of `dockutil --list` is the item URL, e.g. file:///Applications/Zen.app/
- name: Set the Dock items
  ansible.builtin.shell: |
    /opt/homebrew/bin/dockutil --remove all --no-restart
    {% for app in darwin_dock_apps %}
    /opt/homebrew/bin/dockutil --add {{ app | quote }} --no-restart
    {% endfor %}
  when: >-
    darwin_dock_items.stdout_lines | map('split', '\t') | map(attribute=1) | list
    != darwin_dock_apps | map('regex_replace', '^', 'file://') | map('regex_replace', '$', '/') | list
  changed_when: true
  notify: Restart Dock and Finder
