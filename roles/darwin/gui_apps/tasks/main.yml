---
# Homebrew refuses to load casks from a third-party tap until it is trusted.
- name: List trusted Homebrew taps
  ansible.builtin.command: /opt/homebrew/bin/brew trust --json v1
  register: darwin_gui_brew_trust
  changed_when: false
- name: Trust the gui app taps
  ansible.builtin.command: /opt/homebrew/bin/brew trust --tap {{ item }}
  loop: "{{ darwin_gui_taps }}"
  when: "item not in (darwin_gui_brew_trust.stdout | from_json).taps | string"
  changed_when: true
- name: Tap the gui app taps
  community.general.homebrew_tap:
    name: "{{ darwin_gui_taps }}"
    state: present

- name: Install gui applications
  community.general.homebrew_cask:
    name: "{{ darwin_gui_apps }}"
    state: present
    # Take over apps installed by hand before this role ran, instead of failing on them
    install_options: adopt
    sudo_password: "{{ ansible_become_password }}"
- name: Install gui related packages
  community.general.homebrew:
    name: "{{ darwin_gui_packages }}"
    state: present

# Voxtype on macOS: `setup --download` writes the default config and fetches a model,
# `setup app-bundle` wraps the daemon in /Applications/Voxtype.app and adds it to Login
# Items. As an app it can hold the Microphone, Accessibility and Input Monitoring grants
# (a launchd agent never gets the microphone). Those grants stay manual: macOS prompts on
# first run. `voxtype configure` shows a systemctl error under Service on macOS; ignore it.
- name: Set up voxtype
  ansible.builtin.command: /opt/homebrew/bin/voxtype setup --download --quiet
  args:
    creates: "{{ ansible_facts['user_dir'] }}/Library/Application Support/voxtype/config.toml"
- name: Install the voxtype app bundle
  ansible.builtin.command: /opt/homebrew/bin/voxtype setup app-bundle
  args:
    creates: /Applications/Voxtype.app
# Straight from whisper.cpp: `setup --download --model small` resolves to SenseVoice, not
# whisper, and fails.
- name: Download the voxtype model
  ansible.builtin.get_url:
    url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-{{ darwin_voxtype_model }}.bin
    dest: "{{ ansible_facts['user_dir'] }}/Library/Application Support/voxtype/models/ggml-{{ darwin_voxtype_model }}.bin"
    mode: "0644"
# fn is remapped to ctrl, so voxtype gets no hotkey of its own: Hammerspoon runs
# `voxtype record start/stop` while cmd+m is held (~/.hammerspoon in dotfiles). skhd can't,
# it never sees the key go up. The daemon reads its config only on start.
# Whether voxtype-target has switched voxtype to the voxtype server, so a run keeps that
- name: Read voxtype's config
  ansible.builtin.slurp:
    path: "{{ ansible_facts['user_dir'] }}/Library/Application Support/voxtype/config.toml"
  register: darwin_voxtype_config
- name: Note whether voxtype transcribes on the voxtype server
  ansible.builtin.set_fact:
    darwin_voxtype_remote: "{{ darwin_voxtype_config.content | b64decode is search('(?m)^mode = \"remote\"') }}"
- name: Configure voxtype
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/Library/Application Support/voxtype/config.toml"
    regexp: "{{ item.regexp }}"
    insertafter: "{{ item.section }}"
    line: "{{ item.line }}"
  loop:
    - { section: '^\[hotkey\]', regexp: '^enabled = ', line: enabled = false }
    - { section: '^\[whisper\]', regexp: '^model = ', line: 'model = "{{ darwin_voxtype_model }}"' }
    # On the voxtype server whisper only auto-detects: voxtype sends the first language of a list.
    # voxtype-target swaps between this list (kept in the comment) and "auto" when it switches.
    - { section: '^\[whisper\]', regexp: '^language = ', line: "language = {{ '\"auto\"' if darwin_voxtype_remote else darwin_voxtype_language }}" }
    - { section: '^\[whisper\]', regexp: '^# local language \(voxtype-target\): ', line: "# local language (voxtype-target): {{ darwin_voxtype_language }}" }
    # Spelling hint for jargon (voxtype_initial_prompt); remote mode sends it with the audio
    - { section: '^\[whisper\]', regexp: '^initial_prompt = ', line: "initial_prompt = {{ voxtype_initial_prompt | to_json }}" }
    # No banner with the text after every dictation: it is typed and on the clipboard already
    - { section: '^\[output\.notification\]', regexp: '^on_transcription = ', line: on_transcription = false }
  loop_control:
    label: "{{ item.line }}"
  notify: Restart voxtype
# The desktop's voxtype server (arch/voxtype_server) as the remote endpoint. Never `mode`:
# under [whisper] that is voxtype-target's (dotfiles) local/remote switch, so a run keeps it.
# voxtype-postprocess sends the LLM cleanup to the same place while it is remote.
- name: Point voxtype at the voxtype server
  ansible.builtin.lineinfile:
    path: "{{ ansible_facts['user_dir'] }}/Library/Application Support/voxtype/config.toml"
    regexp: "{{ item.regexp }}"
    insertafter: '^\[whisper\]'
    line: "{{ item.line }}"
    mode: "0600" # holds the token
  loop:
    - { regexp: '^remote_endpoint = ', line: 'remote_endpoint = "{{ voxtype_server_url }}"' }
    - { regexp: '^remote_api_key = ', line: 'remote_api_key = "{{ voxtype_server_token }}"' }
    # Fail fast when the desktop is asleep; a 5 s dictation takes ~0.3 s there
    - { regexp: '^remote_timeout_secs = ', line: remote_timeout_secs = 10 }
  loop_control:
    label: "{{ item.regexp }}"
  notify: Restart voxtype

# Every transcript goes through voxtype-postprocess (dotfiles): it copies the raw text to
# the clipboard and, with --llm, swaps in the local model's cleanup before it is typed.
# Flip darwin_voxtype_llm_enabled to turn the LLM off; Ollama stays installed.
- name: Set up Ollama for the voxtype cleanup
  when: darwin_voxtype_llm_enabled
  block:
    - name: Install Ollama
      community.general.homebrew:
        name: ollama
        state: present
    # On disk, so the check works with Ollama stopped (it only runs while voxtype is local)
    - name: Check for the voxtype cleanup model
      ansible.builtin.stat:
        path: "{{ ansible_facts['user_dir'] }}/.ollama/models/manifests/registry.ollama.ai/library/\
          {{ darwin_voxtype_llm_model | regex_replace(':', '/') }}"
      register: darwin_voxtype_llm_model_check
    # `run` starts Ollama without adding it to login; voxtype-target settles that below
    - name: Pull the voxtype cleanup model
      ansible.builtin.shell: |
        /opt/homebrew/bin/brew services run ollama
        for _ in $(seq 20); do /opt/homebrew/bin/ollama list >/dev/null 2>&1 && break; sleep 0.5; done
        /opt/homebrew/bin/ollama pull {{ darwin_voxtype_llm_model | quote }}
      when: not darwin_voxtype_llm_model_check.stat.exists
      changed_when: true
# The hook comes from the dotfiles _common_gui layer; don't point voxtype at a missing file
- name: Check that the voxtype post-process hook is synced
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/.local/bin/voxtype-postprocess"
  register: darwin_voxtype_postprocess
- name: Fail if the voxtype post-process hook is not synced
  ansible.builtin.fail:
    msg: ~/.local/bin/voxtype-postprocess is missing. Run `just sync` in ~/dotfiles first.
  when: not darwin_voxtype_postprocess.stat.exists
- name: Configure voxtype post-processing
  ansible.builtin.blockinfile:
    path: "{{ ansible_facts['user_dir'] }}/Library/Application Support/voxtype/config.toml"
    marker: "# {mark} ANSIBLE MANAGED post-processing (darwin/gui_apps)"
    block: |
      [output.post_process]
      command = "{{ ansible_facts['user_dir'] }}/.local/bin/voxtype-postprocess{{ ' --llm ' ~ darwin_voxtype_llm_model if darwin_voxtype_llm_enabled else '' }}"
      timeout_ms = 10000
  notify: Restart voxtype
# The local Ollama runs only while voxtype transcribes locally with the cleanup on, and is
# not started at login otherwise. voxtype-target (dotfiles) starts and stops it on each switch;
# this brings it in line after a run (a pull above, the LLM turned on or off).
- name: Run the local Ollama only while voxtype is local
  ansible.builtin.command: "{{ ansible_facts['user_dir'] }}/.local/bin/voxtype-target ollama"
  register: darwin_voxtype_ollama
  changed_when: "'changed' in darwin_voxtype_ollama.stdout"

# Ferdium switches services on cmd+1..9 by default, the yabai space keys in ~/.skhdrc.
# alt+1..9 leaves cmd+number to skhd. Ferdium reads this file on start.
- name: Create the Ferdium config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/Library/Application Support/Ferdium/config"
    state: directory
    mode: "0755"
- name: Move Ferdium service switching to alt+number
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/Library/Application Support/Ferdium/config/shortcuts.json"
    mode: "0644"
    content: "{{ darwin_ferdium_shortcuts | to_nice_json(indent=2) }}\n"

# The profile Zen opens is the Default of its [Install...] section in profiles.ini
- name: Find the Zen profile
  ansible.builtin.shell: |
    awk -F= '/^\[Install/ { s = 1; next } /^\[/ { s = 0 } s && $1 == "Default" { print $2; exit }' \
      "{{ ansible_facts['user_dir'] }}/Library/Application Support/zen/profiles.ini"
  register: darwin_zen_profile
  changed_when: false
  failed_when: darwin_zen_profile.rc != 0 or not darwin_zen_profile.stdout
- name: Write the Zen user.js
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/Library/Application Support/zen/{{ darwin_zen_profile.stdout }}/user.js"
    mode: "0644"
    content: |
      // Managed by Ansible (darwin/gui_apps), changes here are overwritten
      {% for k, v in darwin_zen_prefs.items() %}
      user_pref({{ k | to_json }}, {{ v | to_json }});
      {% endfor %}

# Hammerspoon adds itself to Login Items (hs.autoLaunch in init.lua), but only once it
# has run, so the first start is on us.
- name: Start Hammerspoon
  ansible.builtin.shell: |
    pgrep -xq Hammerspoon && exit 0
    open -g -a Hammerspoon
    echo started
  register: darwin_hammerspoon_start
  changed_when: "'started' in darwin_hammerspoon_start.stdout"
