---
- name: Load and decrypt shared variables
  ansible.builtin.set_fact:
    cacheable: true
    # This takes the dict from SOPS and applies it to the host
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ lookup('community.sops.sops', playbook_dir + '/vars/docker_swarm.sops.yml') | from_yaml | dict2items }}"
  no_log: true # Recommended to hide sensitive values from terminal output

- name: Ensure directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ remote_root }}"
    - "{{ remote_data }}"
    - "{{ remote_config }}"

- name: Sync config directory
  ansible.posix.synchronize:
    src: "{{ role_path }}/templates/config"
    dest: "{{ remote_root }}"
    delete: true

- name: Template config files
  ansible.builtin.template:
    src: "config.j2/{{ item.folder }}/{{ item.file }}.j2"
    dest: "{{ remote_config }}/{{ item.folder }}/{{ item.file }}"
    mode: "0644"
  loop:
    - folder: certs
      file: cloudflare.ini
    - folder: caddy
      file: Caddyfile
    - folder: tinyproxy
      file: tinyproxy.conf
  notify: Reload Caddy

- name: Check which Authelia data directories exist
  ansible.builtin.stat:
    path: "{{ item }}"
  register: authelia_data_dirs
  loop:
    - "{{ remote_data }}/authelia"
    - "{{ remote_data }}/authelia/db"
    - "{{ remote_data }}/authelia/redis"
  when: "'authelia' in enabled_services"

- name: Ensure Authelia data directories exist
  # Swarm rejects a service whose bind mount source is missing on the node, so
  # these must exist before the stack deploy. Only created when absent: postgres
  # and redis chown their volume to their own runtime uid on first start, and
  # re-applying a mode afterwards fails for the unprivileged ansible user.
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    mode: "0755"
  loop: "{{ authelia_data_dirs.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  when:
    - "'authelia' in enabled_services"
    - not item.stat.exists

- name: Template Authelia config files
  ansible.builtin.template:
    src: "config.j2/authelia/{{ item }}.j2"
    dest: "{{ remote_config }}/authelia/{{ item }}"
    mode: "0644"
  loop:
    - configuration.yml
    - users_database.yml
  when: "'authelia' in enabled_services"
  notify: Restart Authelia

- name: Template Master file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ remote_root }}/docker-compose.yml"
    mode: "0644"

- name: Deploy the stack to Docker Swarm
  community.docker.docker_stack:
    state: present
    name: "home"
    compose:
      - "{{ remote_root }}/docker-compose.yml"
    # This ensures the stack is updated if the compose file changes
    prune: true
