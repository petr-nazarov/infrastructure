---
- name: Restart voxtype
  ansible.builtin.shell: |
    pkill -f /Applications/Voxtype.app/Contents/MacOS/ || true
    sleep 1
    open -g /Applications/Voxtype.app
  changed_when: true
- name: Reload the voxtype tmp agent
  ansible.builtin.shell: |
    launchctl bootout gui/{{ ansible_facts['user_uid'] }}/{{ darwin_voxtype_tmp_agent_label }} 2>/dev/null || true
    launchctl bootstrap gui/{{ ansible_facts['user_uid'] }} "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents/{{ darwin_voxtype_tmp_agent_label }}.plist"
  changed_when: true
